<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Blank Mode</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>

  <div class="container">

    <!-- ── Header ── -->
    <header class="header">
      <div class="logo">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="2" y="2" width="20" height="20" rx="4" fill="#e63946" />
          <line x1="6" y1="6" x2="18" y2="18" stroke="white" stroke-width="2" stroke-linecap="round"/>
          <polygon points="10,8 16,12 10,16" fill="white" opacity="0.4"/>
        </svg>
      </div>
      <div class="header-text">
        <h1 class="title">Blank Mode</h1>
        <span class="version">v0.2.4</span>
      </div>
    </header>

    <!-- ── Master toggle ── -->
    <div class="toggle-section">
      <div class="toggle-label-group">
        <span class="toggle-label">YouTube Detox Mode</span>
        <span class="toggle-description" id="toggleDescription">Loading…</span>
      </div>
      <label class="toggle-switch" aria-label="Toggle Blank Mode">
        <input type="checkbox" id="blankModeToggle" />
        <span class="slider"></span>
      </label>
    </div>

    <!-- ── Status / pause bar ── -->
    <div class="status-bar" id="statusBar" aria-live="polite" role="status"></div>

    <!-- ══════════════════════════════════════════════════════
         SECTION 1: Pause
    ══════════════════════════════════════════════════════ -->
    <details class="section" id="pauseSection">
      <summary class="section-title">Pause Blank Mode</summary>
      <div class="section-content">

        <!-- Shown when NOT paused -->
        <div id="pauseOptions">
          <p class="section-hint">Temporarily suspend all hiding:</p>
          <div class="pause-buttons">
            <button class="pause-btn" data-minutes="10">10 min</button>
            <button class="pause-btn" data-minutes="30">30 min</button>
            <button class="pause-btn" data-minutes="60">1 hour</button>
          </div>
        </div>

        <!-- Shown when paused -->
        <div id="pauseActive" class="hidden">
          <div class="pause-status">
            <span class="pause-icon">⏸</span>
            <div>
              <p class="pause-label">Paused — hiding suspended</p>
              <p class="pause-countdown" id="pauseCountdown"></p>
            </div>
          </div>
          <button class="resume-btn" id="resumeBtn">Resume now</button>
        </div>

      </div>
    </details>

    <!-- ══════════════════════════════════════════════════════
         SECTION 2: Channel allowlist
    ══════════════════════════════════════════════════════ -->
    <details class="section" id="allowlistSection">
      <summary class="section-title">Channel Allowlist</summary>
      <div class="section-content">

        <p class="section-hint">Blank Mode is skipped on allowlisted channels.</p>

        <!-- Add by typing a pattern -->
        <div class="allowlist-input-row">
          <input
            type="text"
            id="allowlistInput"
            class="allowlist-input"
            placeholder="e.g. @veritasium or /c/kurzgesagt"
            autocomplete="off"
            spellcheck="false"
          />
          <button class="allowlist-add-btn" id="allowlistAddBtn" aria-label="Add">+</button>
        </div>

        <!-- Auto-detect current channel -->
        <button class="detect-btn" id="detectChannelBtn">
          + Add current channel
        </button>

        <!-- List of saved patterns -->
        <ul class="allowlist-list" id="allowlistList">
          <!-- Populated by popup.js -->
        </ul>

        <p class="allowlist-empty hidden" id="allowlistEmpty">No channels allowlisted yet.</p>

      </div>
    </details>

    <!-- ── Footer ── -->
    <footer class="footer">
      <label class="debug-label">
        <input type="checkbox" id="debugToggle" />
        <span>Debug logs in console</span>
      </label>
      <span class="shortcut-hint" title="You can change this in Brave: brave://extensions/shortcuts">
        Toggle: <kbd>Alt+Shift+Y</kbd>
      </span>
    </footer>

  </div>

  <script src="popup.js"></script>
</body>
</html>
